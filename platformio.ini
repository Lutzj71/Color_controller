; PlatformIO Project Configuration File
;
; Target: Panlee ZX7D00CE01S (SC05) - 7" 800x480 RGB panel, GT911 touch,
;         WT32-S3-WROVER-N16R8 (16 MB flash, 8 MB octal PSRAM)
;
; Two environments, identical except for the upload/monitor port:
;   ZX7D00CE01S                - local USB-serial adapter (COM12)
;   ZX7D00CE01S-remote-target  - network serial via an ESP-Link/RFC2217 bridge

[platformio]
default_envs = ZX7D00CE01S

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

monitor_speed = 115200

; 16 MB flash, 8 MB octal PSRAM (required for the RGB frame buffer)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; Same as the board's extra_flags, except ARDUINO_USB_CDC_ON_BOOT=0 so Serial
; goes to UART0 (the COM12 adapter) instead of native USB CDC.
board_build.extra_flags =
    -DARDUINO_ESP32_S3R8N16
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; src/images/ is written by SquareLine Studio in LVGL 9 format (does not build
; with LVGL 8.3). The images actually used come from src/app_images/, generated
; by tools/img2c.py.
build_src_filter =
    +<*>
    -<images/>

; Regenerates src/app_images/*.c from the PNGs (tools/img2c.py) before each build.
extra_scripts = pre:tools/pre_build.py

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@^1.1.16
    knolleary/PubSubClient@^2.8

[env:ZX7D00CE01S]
upload_port = COM12
monitor_port = COM12

[env:ZX7D00CE01S-remote-target]
upload_port = rfc2217://10.186.105.2:4000?ign_set_control
monitor_port = rfc2217://10.186.105.2:4000?ign_set_control
